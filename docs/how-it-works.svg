<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How My Facebook fills your home page</title>
  <desc id="d">Facebook's Friends feed and Pages feed go into My Facebook, which drops ads and unfollowed accounts and orders posts newest first, and the result fills your facebook.com home page. Facebook's main mix of ads, suggestions and group posts is removed before it is drawn.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b74e4"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8d91"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="320" rx="14" fill="#f2f4f7"/>

  <!-- sources -->
  <rect x="24" y="28" width="230" height="66" rx="10" fill="#ffffff" stroke="#ccd0d5"/>
  <text x="139" y="57" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1e21">Facebook's Friends feed</text>
  <text x="139" y="78" text-anchor="middle" font-size="13" fill="#65676b">friends only</text>

  <rect x="24" y="118" width="230" height="66" rx="10" fill="#ffffff" stroke="#ccd0d5"/>
  <text x="139" y="147" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1e21">Facebook's Pages feed</text>
  <text x="139" y="168" text-anchor="middle" font-size="13" fill="#65676b">accounts you follow</text>

  <rect x="24" y="222" width="230" height="66" rx="10" fill="#f2f4f7" stroke="#8a8d91" stroke-dasharray="6 5"/>
  <text x="139" y="251" text-anchor="middle" font-size="15" font-weight="600" fill="#65676b">Facebook's main mix</text>
  <text x="139" y="272" text-anchor="middle" font-size="13" fill="#65676b">ads, suggestions, group posts</text>

  <!-- My Facebook -->
  <rect x="330" y="62" width="220" height="150" rx="12" fill="#1b74e4"/>
  <text x="440" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">My Facebook</text>
  <text x="440" y="126" text-anchor="middle" font-size="13.5" fill="#ffffff">drops ads</text>
  <text x="440" y="150" text-anchor="middle" font-size="13.5" fill="#ffffff">drops accounts you unfollowed</text>
  <text x="440" y="174" text-anchor="middle" font-size="13.5" fill="#ffffff">orders posts newest first</text>

  <!-- result -->
  <rect x="626" y="92" width="190" height="90" rx="10" fill="#ffffff" stroke="#1b74e4" stroke-width="2"/>
  <text x="721" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1e21">Your facebook.com</text>
  <text x="721" y="152" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1e21">home page</text>

  <!-- arrows -->
  <path d="M254 61 C292 61 292 110 328 110" fill="none" stroke="#1b74e4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M254 151 C292 151 292 150 328 150" fill="none" stroke="#1b74e4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M550 137 L624 137" fill="none" stroke="#1b74e4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M254 255 C300 255 296 190 328 190" fill="none" stroke="#8a8d91" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
  <text x="440" y="262" text-anchor="middle" font-size="13" fill="#65676b">removed before it is drawn</text>
</svg>
